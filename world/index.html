<style>
/* Layout: full-bleed WebGL world; HUD pinned to corners (zone + clock top-left, minimap top-right, objective top-centre, prompt + dialog bottom). Single dark neon look by design. */
:root { --ink: #09060a; --glass: rgba(12,7,10,.7); --line: rgba(243,233,228,.16); --red: #e0202e; --red-hot: #ff3b48; --gold: #e8b64c; --bone: #f3e9e4; --dim: #b8a3a0;

[hidden] { display: none !important; }

#stick.on { opacity: 1; top: auto; } #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px; border-radius: 50%; background: rgba(224,32,46,.8); }

#hpbar { left: 50%; transform: translateX(-50%); top: calc(92px + env(safe-area-inset-top, 0px)); width: min(360px, 70vw); text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
#hpbar div { height: 8px; margin-top: 4px; background: rgba(0,0,0,.6); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; } #hpbar i { display: block; height: 100%; background: linear-gradient(90deg, #ff6a3d, var(--red)); transform-origin: left; }
#grid { position: fixed; inset: 0; pointer-events: none; background:
  linear-gradient(90deg, transparent calc(33.33% - .5px), rgba(255,255,255,.22) calc(33.33% - .5px), rgba(255,255,255,.22) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.22) calc(66.66% - .5px), rgba(255,255,255,.22) calc(66.66% + .5px), transparent calc(66.66% + .5px)),
  linear-gradient(0deg, transparent calc(33.33% - .5px), rgba(255,255,255,.22) calc(33.33% - .5px), rgba(255,255,255,.22) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.22) calc(66.66% - .5px), rgba(255,255,255,.22) calc(66.66% + .5px), transparent calc(66.66% + .5px)); }
#grid::after { content: "● REC"; position: absolute; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); color: var(--red-hot); font-weight: 700; letter-spacing: .2em; font-size: 12px; }
.rbtn { position: fixed; display: none; border-radius: 50%; border: 1.5px solid var(--red-hot); background: rgba(16,6,8,.55); color: var(--bone); font: 700 11px var(--body); letter-spacing: .12em; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
#carbtn { width: 58px; height: 58px; right: calc(186px + env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
#brakebtn { width: 64px; height: 64px; right: calc(104px + env(safe-area-inset-right, 0px)); bottom: calc(108px + env(safe-area-inset-bottom, 0px)); }
body.touch #carbtn { display: block; } body.touch.driving #brakebtn { display: block; }
#phonebtn { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(96px + env(safe-area-inset-top, 0px)); border: 1px solid var(--line); background: var(--glass); color: var(--bone); border-radius: 10px; padding: 8px 12px; font: 700 11px var(--body); letter-spacing: .16em; cursor: pointer; }
#panel { position: fixed; inset: 0; display: grid; place-items: center; overflow-y: auto; background: radial-gradient(ellipse at 50% 40%, rgba(120,10,20,.3), rgba(8,3,5,.88) 70%); padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 4; }
.card { width: min(560px, 100%); background: linear-gradient(180deg, rgba(34,12,16,.95), rgba(16,6,8,.97)); border: 1px solid rgba(224,32,46,.5); border-radius: 12px; padding: 20px; display: grid; gap: 12px; }
.card.wide { width: min(760px, 100%); }
.card .eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: .26em; text-transform: uppercase; color: var(--red-hot); }
.card h2 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 28px; line-height: 1.1; text-wrap: balance; }
.card p { margin: 0; line-height: 1.55; font-size: 14.5px; max-width: 62ch; } .card .muted { color: var(--dim); font-size: 13px; }
.card .btns { display: grid; gap: 8px; } .card .row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.card button.b { font: 600 14px/1.25 var(--body); color: var(--bone); background: rgba(255,255,255,.04); border: 1px solid rgba(243,233,228,.18); border-radius: 8px; padding: 11px 14px; text-align: left; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.card button.b:hover, .card button.b:focus-visible { border-color: var(--red-hot); background: rgba(224,32,46,.14); outline: none; }
.card button.b.primary { background: var(--red); border-color: var(--red-hot); color: #fff; } .card button.b.sel { border-color: var(--gold); background: rgba(232,182,76,.14); }
.card button.b[disabled] { opacity: .4; cursor: not-allowed; } .card button.b small { color: var(--dim); font-weight: 500; font-size: 12px; } .card button.b.primary small { color: #ffe1e3; }
.money { color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; }
.sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; } .sheet figure { margin: 0; background: #000; border: 1px solid var(--line); border-radius: 6px; padding: 4px 4px 6px; }
.sheet img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 3px; } .sheet figcaption { font-size: 11px; display: flex; justify-content: space-between; padding-top: 4px; color: var(--dim); } .sheet b { color: var(--gold); }
.grade { font-family: var(--display); font-size: 60px; font-weight: 900; line-height: 1; color: var(--gold); }
.clap { font-family: var(--display); font-weight: 900; font-size: clamp(26px, 6vw, 44px); text-align: center; }
.list { display: grid; gap: 6px; font-size: 13.5px; } .list div { display: flex; justify-content: space-between; gap: 10px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; } .list .done { color: var(--dim); } .list .now { border-color: var(--gold); }
@media (max-width: 640px) { #objbox { top: auto; bottom: calc(196px + env(safe-area-inset-bottom, 0px)); } }

#shutter { bottom: calc(58px + env(safe-area-inset-bottom)); }

.demo-facts { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 0; }
.demo-facts span { border: 1px solid var(--line); padding: 8px; font-size: 10px; letter-spacing: .1em; color: var(--gold); }
#panel .card { box-shadow: 0 30px 100px #0009; }
#loading { z-index: 10; text-align: center; padding: 24px; letter-spacing: .1em; }
@media (max-width: 640px) { #demo-guide { bottom: calc(274px + env(safe-area-inset-bottom)); width: calc(100% - 60px); } .card h2 { font-size: 26px; } #dialog { bottom: calc(130px + env(safe-area-inset-bottom)); } }

</style>

<body>
<canvas id="view" aria-label="Las Vegas street, third-person view"></canvas>
<div id="loc" class="hud"><div id="zone">Las Vegas</div><div id="clock">11:42 PM</div><div id="money"><b>$250</b><i>REP 0</i></div></div>
<button id="phonebtn" aria-label="Open phone menu">PHONE</button>
<div id="objbox" class="hud"><small>Objective</small><div id="objective"></div><div id="timer" hidden></div></div>
<div id="hpbar" class="hud" hidden><span id="hpname">Target</span><div><i id="hpfill"></i></div></div>
<div id="speedo" class="hud" hidden>0<small>MPH</small></div>
<div id="grid" hidden></div>
<canvas id="map" class="hud" aria-label="Minimap"></canvas>
<div id="prompt" class="hud" hidden><kbd>E</kbd><span id="prompt-text"></span></div>
<div id="dialog" hidden><div id="dlg-who"></div><p id="dlg-text"></p><small>E · Next</small></div>
<div id="strip" class="hud" aria-label="Photos taken"></div>
<div id="help" class="hud"><kbd>WASD</kbd> move · <kbd>Shift</kbd> run · <kbd>Mouse</kbd> look (click to lock)<br><kbd>E</kbd> talk / enter · <kbd>F</kbd> car · <kbd>Space</kbd> brake · <kbd>P</kbd> photo · <kbd>Tab</kbd> phone</div>
<div id="stick"><div id="knob"></div></div>
<button id="act" aria-label="Interact">ACT</button>
<button id="carbtn" class="rbtn" aria-label="Get in or out of the car">CAR</button>
<button id="brakebtn" class="rbtn" aria-label="Brake">BRAKE</button>
<div id="panel" hidden></div>
<button id="shutter" aria-label="Take a photo">SHOOT</button>
<div id="toast" class="hud" role="status"></div>
<div id="flash"></div><div id="fade"></div>
<button id="quality" aria-label="Cycle graphics quality: performance, balanced, cinematic">BALANCED</button>
<div id="demo-guide" hidden role="status"></div>
<div id="loading">MVP MEDIA · LAS VEGAS — THE UNDERGROUND CUT</div>
<script type="module">
import('./main.js?v=velvet-block-3').catch(error => {
  console.error(error);
  const loading = document.getElementById('loading');
  loading.hidden = false;
  loading.replaceChildren(document.createTextNode('Unable to start the 3D demo. Check your connection and WebGL support. '));
  const retry = document.createElement('button'); retry.textContent = 'Retry'; retry.onclick = () => location.reload(); loading.append(retry);
});
</script>
