<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MVP Media: Las Vegas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed WebGL world; HUD pinned to corners (zone + clock top-left, minimap top-right, objective top-centre, prompt + dialog bottom). Single dark neon look by design. */
:root { --ink: #09060a; --glass: rgba(12,7,10,.7); --line: rgba(243,233,228,.16); --red: #e0202e; --red-hot: #ff3b48; --gold: #e8b64c; --bone: #f3e9e4; --dim: #b8a3a0;
  --display: "Cinzel", Georgia, serif; --body: "Montserrat", system-ui, sans-serif; color-scheme: dark; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--bone); font-family: var(--body); overflow: hidden; -webkit-user-select: none; user-select: none; }
[hidden] { display: none !important; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hud { position: fixed; pointer-events: none; }
#loc { left: max(16px, env(safe-area-inset-left, 0px)); top: calc(14px + env(safe-area-inset-top, 0px)); display: grid; gap: 4px; }
#zone { font-family: var(--display); font-weight: 900; font-size: clamp(20px, 3vw, 30px); letter-spacing: .02em; text-shadow: 0 2px 12px rgba(0,0,0,.8); }
#zone.pop { animation: pop .6s ease-out; } @keyframes pop { from { opacity: 0; transform: translateY(-6px); } }
#clock { font-size: 12px; font-weight: 600; letter-spacing: .22em; color: var(--dim); }
#objbox { left: 50%; transform: translateX(-50%); top: calc(14px + env(safe-area-inset-top, 0px)); background: var(--glass); border: 1px solid var(--line); border-left: 3px solid var(--red); border-radius: 8px; padding: 8px 14px; max-width: min(460px, 70vw); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
#objbox small { display: block; font-size: 10px; font-weight: 700; letter-spacing: .22em; color: var(--red-hot); text-transform: uppercase; }
#objective { font-size: 14px; font-weight: 600; }
#map { right: max(16px, env(safe-area-inset-right, 0px)); top: calc(14px + env(safe-area-inset-top, 0px)); width: min(170px, 28vw); height: min(170px, 28vw); border-radius: 50%; border: 2px solid rgba(224,32,46,.7); box-shadow: 0 6px 24px rgba(0,0,0,.6); }
#prompt { left: 50%; transform: translateX(-50%); bottom: calc(118px + env(safe-area-inset-bottom, 0px)); background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px 9px 9px; display: flex; gap: 10px; align-items: center; font-weight: 600; font-size: 14px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
#prompt kbd { font: 700 12px var(--body); background: var(--bone); color: var(--ink); border-radius: 50%; width: 26px; height: 26px; display: grid; place-items: center; }
#dialog { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(110px + env(safe-area-inset-bottom, 0px)); width: min(620px, calc(100% - 32px)); background: rgba(12,7,10,.86); border: 1px solid var(--line); border-top: 2px solid var(--red); border-radius: 12px; padding: 14px 18px 12px; cursor: pointer; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
#dlg-who { font-family: var(--display); font-weight: 900; color: var(--gold); font-size: 15px; letter-spacing: .03em; }
#dlg-text { margin: 6px 0 4px; line-height: 1.55; font-size: 15px; max-width: 62ch; }
#dialog small { color: var(--dim); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
#shutter { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 64px; height: 64px; border-radius: 50%; border: 5px solid rgba(255,255,255,.35); background: rgba(243,233,228,.9); background-clip: padding-box; font: 700 9px var(--body); letter-spacing: .14em; color: #120607; cursor: pointer; }
#act { display: none; position: fixed; right: calc(98px + env(safe-area-inset-right, 0px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); width: 74px; height: 74px; border-radius: 50%; border: 1.5px solid var(--red-hot); background: rgba(16,6,8,.55); color: var(--bone); font: 700 12px var(--body); letter-spacing: .14em; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
#strip { left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; }
#strip img { height: 52px; border-radius: 6px; border: 1px solid var(--line); }
#help { left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); font-size: 12px; color: var(--dim); line-height: 1.7; }
#help kbd { font: 600 11px var(--body); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; color: var(--bone); }
#stick { position: fixed; left: 90px; bottom: 70px; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba(243,233,228,.3); background: rgba(16,6,8,.3); display: none; pointer-events: none; opacity: .55; }
#stick.on { opacity: 1; top: auto; } #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px; border-radius: 50%; background: rgba(224,32,46,.8); }
body.touch #stick { display: block; top: calc(100% - 110px); } body.touch #act { display: block; } body.touch #help { display: none; }
body.touch #strip { bottom: calc(190px + env(safe-area-inset-bottom, 0px)); }
#toast { left: 50%; top: calc(80px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -10px); opacity: 0; transition: all .25s; background: var(--glass); border: 1px solid var(--line); border-radius: 9px; padding: 9px 14px; font-size: 13px; max-width: calc(100% - 32px); }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; } #flash.go { animation: fl .45s ease-out; } @keyframes fl { from { opacity: .9; } to { opacity: 0; } }
#fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .35s; } #fade.on { opacity: 1; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--ink); font-family: var(--display); letter-spacing: .3em; color: var(--dim); }
@media (max-width: 640px) { #objbox { top: auto; bottom: calc(196px + env(safe-area-inset-bottom, 0px)); } }
@media (prefers-reduced-motion: reduce) { #zone.pop, #flash.go { animation: none; } #toast, #fade { transition: none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view" aria-label="Las Vegas street, third-person view"></canvas>
<div id="loc" class="hud"><div id="zone">Las Vegas</div><div id="clock">11:42 PM</div></div>
<div id="objbox" class="hud"><small>Objective</small><div id="objective"></div></div>
<canvas id="map" class="hud" aria-label="Minimap"></canvas>
<div id="prompt" class="hud" hidden><kbd>E</kbd><span id="prompt-text"></span></div>
<div id="dialog" hidden><div id="dlg-who"></div><p id="dlg-text"></p><small>E · Next</small></div>
<div id="strip" class="hud" aria-label="Photos taken"></div>
<div id="help" class="hud"><kbd>WASD</kbd> move · <kbd>Shift</kbd> run · <kbd>Mouse</kbd> look (click to lock)<br><kbd>E</kbd> talk / enter · <kbd>P</kbd> photo · <kbd>Esc</kbd> free the mouse</div>
<div id="stick"><div id="knob"></div></div>
<button id="act" aria-label="Interact">ACT</button>
<button id="shutter" aria-label="Take a photo">SHOOT</button>
<div id="toast" class="hud" role="status"></div>
<div id="flash"></div><div id="fade"></div>
<div id="loading">LOADING LAS VEGAS</div>
<script type="module" src="./main.js"></script>
</body>
</html>
