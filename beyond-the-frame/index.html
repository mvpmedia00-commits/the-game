/* Layout: full-bleed WebGL city with a 2D HUD canvas on top; story/menus as smoked-glass cards over a red haze. Single dark neon world by design. */
:root {
  --ink: #0b0507;        /* night */
  --smoke: #1a0b0e;      /* panel fill */
  --red: #e0202e;        /* MVP red */
  --red-hot: #ff3b48;
  --gold: #e8b64c;       /* money */
  --bone: #f3e9e4;       /* text */
  --bone-dim: #b8a3a0;
  --display: "Anton", "Impact", "Arial Narrow", sans-serif;
  --body: "Montserrat", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--bone); overflow: hidden; font-family: var(--body); }
[hidden] { display: none !important; }
#c { position: fixed; inset: 0; display: block; width: 100%; height: 100%; background: var(--ink); }
#hud { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#scrim { position: fixed; inset: 0; display: grid; place-items: center; overflow-y: auto;
  background: radial-gradient(ellipse at 50% 40%, rgba(120,10,20,.35), rgba(8,3,5,.9) 70%);
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.card { width: min(560px, 100%); background: linear-gradient(180deg, rgba(34,12,16,.94), rgba(16,6,8,.96)); border: 1px solid rgba(224,32,46,.55);
  box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 20px 60px rgba(0,0,0,.6), 0 0 40px rgba(224,32,46,.15); padding: 22px; display: grid; gap: 14px; border-radius: 4px; }
.card.wide { width: min(760px, 100%); }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .28em; text-transform: uppercase; color: var(--red-hot); }
.card h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1.05; letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; }
.card p { margin: 0; line-height: 1.55; font-size: 15px; max-width: 62ch; }
.muted { color: var(--bone-dim); font-size: 13px; }
.line { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
.who { font-family: var(--display); font-size: 15px; letter-spacing: .04em; color: var(--gold); text-transform: uppercase; white-space: nowrap; }
.btns { display: grid; gap: 8px; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.btn { font: 600 14px/1.25 var(--body); color: var(--bone); background: rgba(255,255,255,.04); border: 1px solid rgba(243,233,228,.18); border-radius: 3px;
  padding: 11px 14px; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.btn:hover, .btn:focus-visible { border-color: var(--red-hot); background: rgba(224,32,46,.14); outline: none; }
.btn.primary { background: var(--red); border-color: var(--red-hot); color: #fff; }
.btn.primary:hover, .btn.primary:focus-visible { background: var(--red-hot); }
.btn.sel { border-color: var(--gold); background: rgba(232,182,76,.14); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn small { font-weight: 500; color: var(--bone-dim); font-size: 12px; }
.btn.primary small { color: #ffe1e3; }
.logo { text-align: center; display: grid; justify-items: center; gap: 2px; }
.logo .mvp { font-family: var(--display); font-size: clamp(84px, 22vw, 150px); line-height: .9; color: var(--red); letter-spacing: .01em;
  text-shadow: 0 0 30px rgba(224,32,46,.45), 0 4px 0 #5a0a10; }
.logo .media { font-weight: 500; font-size: clamp(20px, 5vw, 30px); letter-spacing: .55em; margin-right: -.55em; color: var(--bone); }
.logo .tag { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--red); font-weight: 700; font-size: 12px; letter-spacing: .4em; margin-right: -.4em; color: var(--red-hot); text-transform: uppercase; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; font-size: 14px; }
.keys kbd { font: 600 12px var(--body); border: 1px solid var(--red-hot); color: var(--bone); border-radius: 3px; padding: 2px 7px; text-align: center; }
.keys span { color: var(--bone-dim); }
.sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.sheet figure { margin: 0; background: #000; border: 1px solid rgba(243,233,228,.2); padding: 4px 4px 6px; }
.sheet img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; }
.sheet figcaption { font-size: 11px; display: flex; justify-content: space-between; padding-top: 4px; font-variant-numeric: tabular-nums; color: var(--bone-dim); }
.sheet b { color: var(--gold); }
.grade { font-family: var(--display); font-size: 64px; line-height: 1; color: var(--gold); }
.talent { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.talent .btn { display: grid; gap: 3px; justify-content: stretch; }
.talent .nm { font-family: var(--display); font-size: 18px; letter-spacing: .02em; text-transform: uppercase; font-weight: 400; }
.stars { color: var(--gold); letter-spacing: .1em; }
.money { color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; }
.clap { font-family: var(--display); font-size: clamp(30px, 7vw, 54px); text-align: center; text-transform: uppercase; letter-spacing: .03em; }
h3 { margin: 4px 0 0; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--bone-dim); font-weight: 700; }
#toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(70px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; pointer-events: none; width: min(420px, calc(100% - 32px)); }
.toast { background: rgba(16,6,8,.92); border-left: 3px solid var(--red); padding: 8px 12px; font-size: 13px; animation: tin .25s ease-out; }
.toast b { color: var(--gold); margin-right: 6px; }
@keyframes tin { from { opacity: 0; transform: translateY(10px); } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
/* 2026 title: 3D set on the left, brand lockup on the right (stacks at the bottom on phones) */
#scrim.title-mode { background: linear-gradient(90deg, rgba(8,3,5,0) 38%, rgba(8,3,5,.55) 62%, rgba(8,3,5,.82)); place-items: center end; }
.hero-ui { width: min(440px, 100%); display: grid; gap: 18px; margin-right: clamp(0px, 4vw, 60px); }
.brand { display: grid; justify-items: center; text-align: center; gap: 2px; }
.brand .crown { width: 46px; color: #e8b64c; filter: drop-shadow(0 0 8px rgba(232,182,76,.6)); margin-bottom: 4px; }
.b-mvp { font-family: "Cinzel", "Trajan Pro", Georgia, serif; font-weight: 900; font-size: clamp(64px, 11vw, 118px); line-height: .9; letter-spacing: .02em;
  background: linear-gradient(180deg, #ff6a70 0%, #e0202e 38%, #9a0a14 70%, #ff3a44 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 0 #3a0408) drop-shadow(0 0 24px rgba(224,32,46,.45)); }
.b-media { font-family: "Cinzel", Georgia, serif; font-weight: 700; font-size: clamp(36px, 6.2vw, 64px); line-height: 1; letter-spacing: .04em;
  background: linear-gradient(180deg, #ffffff 0%, #c8c8d0 45%, #7a7a84 55%, #e8e8f0 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #111); }
.b-rule { width: 100%; height: 2px; margin: 10px 0 6px; background: linear-gradient(90deg, transparent, #ff2a3a 30%, #ff6a70 50%, #ff2a3a 70%, transparent); box-shadow: 0 0 14px rgba(255,42,58,.8); }
.b-own { font-family: "Cinzel", Georgia, serif; font-weight: 600; letter-spacing: .32em; margin-right: -.32em; font-size: 15px; color: var(--bone); }
.b-svc { margin-top: 10px; font-size: 10.5px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--bone-dim); }
.b-svc i { font-style: normal; color: var(--red-hot); margin: 0 .4em; }
.hero-ui .btn { background: rgba(10,4,6,.55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.hero-ui .btn.primary { background: linear-gradient(180deg, #ff3b48, #b8101c); }
.hero-ui .muted { text-align: center; }
@media (max-aspect-ratio: 23/20) {
  #scrim.title-mode { background: linear-gradient(180deg, rgba(8,3,5,0) 30%, rgba(8,3,5,.7) 55%, rgba(8,3,5,.92)); place-items: end center; }
  .hero-ui { margin-right: 0; gap: 12px; }
  .b-mvp { font-size: clamp(54px, 17vw, 96px); }
}
/* Touch remote (iPhone): thumb joystick left, action buttons right */
#c, #remote { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#remote { position: fixed; inset: 0; pointer-events: none; }
#remote .rb { pointer-events: auto; position: absolute; touch-action: none; border-radius: 50%; display: grid; place-items: center; padding: 0;
  font: 700 11px/1 var(--body); letter-spacing: .14em; color: var(--bone); background: rgba(16,6,8,.5); border: 1.5px solid rgba(255,59,72,.65);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); -webkit-tap-highlight-color: transparent; }
#remote .rb.on { background: rgba(224,32,46,.7); border-color: var(--red-hot); }
#remote .rb.ready { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(232,182,76,.25); }
#remote .rb.dim { opacity: .35; }
#remote .act { width: 84px; height: 84px; font-size: 13px; right: calc(22px + env(safe-area-inset-right, 0px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); }
#remote .car { width: 60px; height: 60px; right: calc(116px + env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
#remote .brake { width: 60px; height: 60px; right: calc(30px + env(safe-area-inset-right, 0px)); bottom: calc(122px + env(safe-area-inset-bottom, 0px)); }
#remote .pause { width: 44px; height: 44px; border-radius: 10px; font-size: 14px; letter-spacing: 0; left: calc(12px + env(safe-area-inset-left, 0px)); top: calc(96px + env(safe-area-inset-top, 0px)); }
#remote .shutter { width: 88px; height: 88px; right: calc(22px + env(safe-area-inset-right, 0px)); top: 50%; margin-top: -44px; background: rgba(243,233,228,.85); color: #120607; border: 5px solid rgba(255,255,255,.4); background-clip: padding-box; }
#remote .shutter.on { background: #fff; }
#remote .zin, #remote .zout { width: 52px; height: 52px; font-size: 22px; letter-spacing: 0; right: calc(122px + env(safe-area-inset-right, 0px)); }
#remote .zin { top: calc(50% - 58px); } #remote .zout { top: calc(50% + 6px); }
@media (pointer: coarse) { #toasts { bottom: auto; top: calc(62px + env(safe-area-inset-top, 0px)); } }
#remote[data-mode="world"] .s-only, #remote[data-mode="shoot"] .w-only { display: none; }
#stick { position: absolute; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; border: 2px solid rgba(243,233,228,.3); background: rgba(16,6,8,.3); opacity: .55; transition: opacity .15s; }
#stick.on { opacity: 1; transition: none; }
#knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(224,32,46,.8); box-shadow: 0 0 18px rgba(224,32,46,.5); }
#rotate { position: fixed; left: 0; right: 0; bottom: calc(160px + env(safe-area-inset-bottom, 0px)); text-align: center; font: 600 13px var(--body); color: var(--bone-dim); pointer-events: none; padding-inline: 16px; }
@media (orientation: landscape) { #rotate { display: none; } }
</style>

function prodCost() { return (prod.story ? 0 : prod.cast.reduce((s, id) => s + TALENT[id].fee, 0)) + SETS[prod.set].cost + BUDGET[prod.budget].cost; }

const CALLS = [['light', 'Lighting', ['warm', 'cool', 'neon']], ['mood', 'Mood', ['playful', 'romantic', 'dramatic']], ['cam', 'Camera', ['handheld', 'dolly', 'locked-off']]];

function renderCall() {

function prodCall(o) {

  for (const t of cast) { if (t.light === prod.calls.light) q += 7; if (t.mood === prod.calls.mood) q += 7; }

// ------------------------------------------------------------ LOOP
let last = performance.now(), autosave = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (S.mode === 'shoot' && shoot) { updShoot(dt); renderShoot(); }
  else {
    if (S.mode === 'play') { update(dt); updCamera(dt); autosave += dt; if (autosave > 15) { autosave = 0; persist(); } }

      S.t += dt; const a = S.t * 0.035, cx = 44 * TS * K, cz = 36 * TS * K;
      cam.position.set(cx + Math.cos(a) * 130, 105, cz + Math.sin(a) * 130); cam.lookAt(cx, 0, cz);

      if (traffic.length < 26) { const c = spawnTrafficCar(ref); if (c) traffic.push(c); }
      traffic = traffic.filter(c => Math.hypot(c.x - ref.x, c.y - ref.y) < 2000);
    }
    if (S.mode === 'title' && heroScene) { updTitle(dt); draw(heroScene, heroCam, 0.85); drawHud(); }
    else { sync3D(dt); draw(world, cam, 1); drawHud(); }
  }

}
